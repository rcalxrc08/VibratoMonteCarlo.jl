name: Build and Deploy
# Builds the landing page (Franklin, PkgPage) and publishes it with GitHub Pages, whose source is "GitHub Actions": the
# site is uploaded as the Pages artifact and deployed by actions/deploy-pages, with no gh-pages branch.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write    # the deployment
  id-token: write # the token of the deployment
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: "1.10"
    - run: cp etc/logo.png page/_assets/logo.png # the logo lives in etc/ only
    - run: julia -e '
            import Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/rcalxrc08/LocalRegistry.git"));
            Pkg.Registry.add("General");
            Pkg.activate("page"); Pkg.develop(path = "."); Pkg.instantiate();
            using NodeJS;
            run(`$(npm_cmd()) install highlight.js purgecss`);
            import PkgPage;
            PkgPage.optimize(input="page", output="")'
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: page/__site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy 🚀
      id: deployment
      uses: actions/deploy-pages@v5
